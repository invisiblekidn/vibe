<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Панель сотрудника — VIBE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/css/vibe.css">
<style>
  .staff { display: grid; gap: 12px; padding-block: 8px 40px; }
  .ord { padding: 14px; display: grid; gap: 8px; }
  .ord.attn { box-shadow: inset 0 0 0 2px var(--warn); }
  .ord .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ord .no { font-weight: 800; font-size: 20px; }
  .ord .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .ord ul { margin: 0; padding-left: 18px; font-size: 14.5px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .login { max-width: 360px; margin: 40px auto; padding: 20px; display: grid; gap: 12px; }
</style>
</head>
<body>
<div class="test-banner">Тестовая версия: заказы не настоящие</div>
<header class="wrap topbar">
  <a class="logo" href="/staff">VIBE<small>ПАНЕЛЬ СОТРУДНИКА</small></a>
  <span id="who" class="muted"></span>
</header>
<main class="wrap" id="root"></main>
<script src="/js/common.js"></script>
<script src="/js/staff.js"></script>
</body>
</html>
