<!doctype html>
<html lang="ru" data-fixed-lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Панель сотрудника — VIBE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/css/vibe.css">
<style>
  .staff { display: grid; gap: 12px; padding-block: 8px 40px; }
  .ord { padding: 14px; display: grid; gap: 8px; }
  .ord.attn { box-shadow: inset 0 0 0 2px var(--warn); }
  .ord .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ord .no { font-weight: 800; font-size: 20px; }
  .ord .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .ord ul { margin: 0; padding-left: 18px; font-size: 14.5px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .login { max-width: 360px; margin: 40px auto; padding: 20px; display: grid; gap: 12px; }
  /* Вкладка «Бот» */
  #bot { display: grid; gap: 12px; }
  .bot-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  @media (max-width: 820px) { .bot-grid { grid-template-columns: minmax(0, 1fr); } }
  .bot-col { display: grid; gap: 12px; min-width: 0; }
  .bot-sec { padding: 14px; display: grid; gap: 10px; }
  .bot-sec h3 { margin: 0; font-size: 17px; }
  .bot-sec h3 small { font-weight: 600; font-size: 13.5px; margin-left: 6px; }
  .bot-day { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .bot-day img, .bot-day .ph { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--v-chip); flex: none; }
  .bot-day .t { flex: 1; min-width: 140px; }
  .bot-day .acts { display: flex; gap: 6px; }
  .bot-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .bot-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; background: var(--v-bg); border-radius: 12px; padding: 8px 10px; }
  .bot-list .n { font-weight: 800; color: var(--v-soft); }
  .bot-list .ctl { grid-column: 2 / -1; display: flex; gap: 6px; }
  .bot-list .ctl .btn { min-height: 32px; padding: 4px 12px; }
  .bot-results { display: grid; gap: 6px; }
  .bot-res { display: flex; justify-content: space-between; gap: 10px; align-items: center; text-align: left; background: var(--v-bg); border: 1.5px solid var(--v-line); border-radius: 12px; padding: 8px 10px; font: inherit; color: inherit; cursor: pointer; }
  .bot-res:hover, .bot-res:focus-visible { border-color: var(--v-brush); }
  .bot-prev { background: var(--v-chip); }
  .tg-msg { background: var(--v-paper); border-radius: 12px 12px 12px 4px; padding: 8px 11px; font-size: 14px; }
  .tg-btn { background: var(--v-paper); border-radius: 9px; padding: 7px 10px; text-align: center; font-weight: 700; font-size: 13.5px; color: var(--v-brush); }
  .bot-log { margin: 0; padding-left: 18px; font-size: 13.5px; display: grid; gap: 4px; }
</style>
</head>
<body>
<header class="wrap topbar">
  <a class="logo" href="/staff">VIBE<small>ПАНЕЛЬ СОТРУДНИКА</small></a>
  <span id="who" class="muted"></span>
</header>
<main class="wrap" id="root"></main>
<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script src="/js/staff.js"></script>
<script src="/js/staff-bot.js"></script>
</body>
</html>
