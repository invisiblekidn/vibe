<!doctype html>
<html lang="ru" data-fixed-lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Панель сотрудника — VIBE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/css/vibe.css">
<style>
  .staff { display: grid; gap: 12px; padding-block: 8px 40px; }
  .ord { padding: 14px; display: grid; gap: 8px; }
  .ord.attn { box-shadow: inset 0 0 0 2px var(--warn); }
  .ord .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ord .no { font-weight: 800; font-size: 20px; }
  .ord .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .ord ul { margin: 0; padding-left: 18px; font-size: 14.5px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .login { max-width: 360px; margin: 40px auto; padding: 20px; display: grid; gap: 12px; }
  /* Вкладка «Бот» */
  #bot { display: grid; gap: 12px; }
  .bot-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  @media (max-width: 820px) { .bot-grid { grid-template-columns: minmax(0, 1fr); } }
  .bot-col { display: grid; gap: 12px; min-width: 0; }
  .bot-sec { padding: 14px; display: grid; gap: 10px; }
  .bot-sec h3 { margin: 0; font-size: 17px; }
  .bot-sec h3 small { font-weight: 600; font-size: 13.5px; margin-left: 6px; }
  .bot-day { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .bot-day img, .bot-day .ph { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--v-chip); flex: none; }
  .bot-day .t { flex: 1; min-width: 140px; }
  .bot-day .acts { display: flex; gap: 6px; }
  .bot-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .bot-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; background: var(--v-bg); border-radius: 12px; padding: 8px 10px; }
  .bot-list .n { font-weight: 800; color: var(--v-soft); }
  .bot-list .ctl { grid-column: 2 / -1; display: flex; gap: 6px; }
  .bot-list .ctl .btn { min-height: 32px; padding: 4px 12px; }
  .bot-results { display: grid; gap: 6px; }
  .bot-res { display: flex; justify-content: space-between; gap: 10px; align-items: center; text-align: left; background: var(--v-bg); border: 1.5px solid var(--v-line); border-radius: 12px; padding: 8px 10px; font: inherit; color: inherit; cursor: pointer; }
  .bot-res:hover, .bot-res:focus-visible { border-color: var(--v-brush); }
  .bot-prev { background: var(--v-chip); }
  .tg-msg { background: var(--v-paper); border-radius: 12px 12px 12px 4px; padding: 8px 11px; font-size: 14px; }
  .tg-btn { background: var(--v-paper); border-radius: 9px; padding: 7px 10px; text-align: center; font-weight: 700; font-size: 13.5px; color: var(--v-brush); }
  /* Вкладка «Стоп-лист» */
  #stop { display: grid; gap: 12px; }
  .stop-head { position: sticky; top: 0; z-index: 3; padding: 12px 14px; display: grid; gap: 10px; box-shadow: 0 2px 8px rgba(43, 33, 25, .08); }
  .stop-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .stop-top h3 { margin: 0; font-size: 18px; }
  #stop-q { width: 100%; font: inherit; font-size: 16px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--v-line); background: var(--v-bg); color: inherit; }
  .stop-jump { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; padding: 0 2px; }
  .stop-jump::-webkit-scrollbar { display: none; }
  .stop-jump .chip { flex: none; padding: 6px 12px; font-size: 13.5px; }
  .stop-help { margin: 0; font-size: 13.5px; }
  .stop-cat { padding: 12px; display: grid; gap: 6px; scroll-margin-top: 150px; }
  .stop-cat h3 { margin: 2px 4px 4px; font-size: 17px; }
  .stop-cat h3 small { font-weight: 600; font-size: 13.5px; margin-left: 4px; }
  .stop-n { color: var(--bad); font-weight: 800; }
  .stop-sub { margin: 8px 4px 0; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--v-soft); }
  .stop-now { box-shadow: inset 0 0 0 2px var(--bad-bg); }
  .stop-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--v-bg); cursor: pointer; min-height: 60px; }
  .stop-row.on { background: var(--bad-bg); box-shadow: inset 4px 0 0 var(--bad); }
  .stop-ph { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; background: var(--v-chip); }
  .stop-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stop-row.on .stop-ph img { filter: grayscale(1); opacity: .7; }
  .stop-t { display: grid; gap: 1px; min-width: 0; }
  .stop-t b { font-size: 15px; line-height: 1.25; }
  .stop-t small { font-size: 13px; }
  .stop-who { color: var(--bad); font-weight: 700; }
  .stop-sw { position: relative; width: 52px; height: 32px; flex: none; }
  .stop-sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .stop-sw i { position: absolute; inset: 0; border-radius: 999px; background: var(--v-line); transition: background .15s; pointer-events: none; }
  .stop-sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
  .stop-sw input:checked + i { background: var(--bad); }
  .stop-sw input:checked + i::after { transform: translateX(20px); }
  .stop-sw input:focus-visible + i { outline: 2px solid var(--v-brush); outline-offset: 2px; }
  .stop-sw input:disabled + i { opacity: .6; }
  .bot-log { margin: 0; padding-left: 18px; font-size: 13.5px; display: grid; gap: 4px; }
</style>
</head>
<body>
<header class="wrap topbar">
  <a class="logo" href="/staff">VIBE<small>ПАНЕЛЬ СОТРУДНИКА</small></a>
  <span id="who" class="muted"></span>
</header>
<main class="wrap" id="root"></main>
<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script src="/js/staff.js"></script>
<script src="/js/staff-bot.js"></script>
<script src="/js/staff-stop.js"></script>
</body>
</html>
