name = "vibe-restaurant"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/tg/*"]

[[d1_databases]]
binding = "DB"
database_name = "vibe-db"
# Тестовая база в Cloudflare (создана 10.11.2026). Локально wrangler dev использует свою копию.
database_id = "9bfc16db-15f0-409c-a5bb-414fb0b62a4a"
migrations_dir = "migrations"

[vars]
LOCATION_ID = "nt1"
# Тестовый адрес (бесплатный workers.dev). Свой домен подключим к запуску.
PUBLIC_URL = "https://vibe-restaurant.invisiblekidn.workers.dev"
TG_BOT_USERNAME = "vibe_kid_bot"

[observability]
enabled = true
