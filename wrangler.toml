name = "vibe-restaurant"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/tg/*", "/t/*"]

[[d1_databases]]
binding = "DB"
database_name = "vibe-db"
# Рабочая база в Cloudflare (создана 10.11.2026). Локально wrangler dev использует свою копию.
database_id = "9bfc16db-15f0-409c-a5bb-414fb0b62a4a"
migrations_dir = "migrations"

[vars]
LOCATION_ID = "nt1"
# Рабочий адрес (бесплатный workers.dev) с 19.11.2026. При переходе на свой домен перевыпустить QR столов.
PUBLIC_URL = "https://vibe-restaurant.invisiblekidn.workers.dev"
TG_BOT_USERNAME = "vibe_kid_bot"
# Живая карточка заказа в боте (виджет Telegram): off — выключена, staff — только сотрудникам из TG_STAFF (показ), all — всем гостям.
TG_GUEST_WIDGET = "all"

[observability]
enabled = true
